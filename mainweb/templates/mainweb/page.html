{% extends 'basic.html' %}

{% block title %}{{ page.title }} - {{ t('website_title') }}{% endblock %}

{% block content %}
    {% include 'components/headers/main_header.html' %}
    {% include 'components/hero/main_hero.html' %}

    <section class="info-page-shell">
        <div class="container mx-auto px-4 py-10 md:py-12 lg:py-14">
            <div class="info-page-intro">
                <h1 class="info-page-title">{{ page.title }}</h1>
            </div>

            <div class="max-w-5xl mx-auto">
                <article class="info-page-main">
                    <div class="info-page-surface">
                        <div class="info-page-content">
                            {{ page.content|safe }}
                        </div>
                    </div>
                </article>
            </div>
        </div>
    </section>
{% endblock %}
