    <script>
        window.csrfToken = {{ csrf_token|tojson }};
        window.CSRF_HEADER = 'X-CSRF-Token';

        (function () {
            function isSameOrigin(url) {
                if (!url) {
                    return true;
                }

                try {
                    const resolved = new URL(url, window.location.origin);
                    return resolved.origin === window.location.origin;
                } catch (error) {
                    return true;
                }
            }

            function requiresCsrf(method) {
                const normalized = String(method || 'GET').toUpperCase();
                return ['POST', 'PUT', 'PATCH', 'DELETE'].includes(normalized);
            }

            function ensureFormToken(form) {
                if (!form || form.method.toUpperCase() !== 'POST' || !window.csrfToken) {
                    return;
                }

                let input = form.querySelector('input[name="csrf_token"]');
                if (!input) {
                    input = document.createElement('input');
                    input.type = 'hidden';
                    input.name = 'csrf_token';
                    form.appendChild(input);
                }
                input.value = window.csrfToken;
            }

            function ensureAllFormTokens() {
                document.querySelectorAll('form').forEach(ensureFormToken);
            }

            if (window.jQuery) {
                window.jQuery.ajaxPrefilter(function (options, originalOptions, jqXHR) {
                    const method = (options.type || options.method || 'GET').toUpperCase();
                    if (!requiresCsrf(method) || !isSameOrigin(options.url) || !window.csrfToken) {
                        return;
                    }
                    jqXHR.setRequestHeader(window.CSRF_HEADER, window.csrfToken);
                });
            }

            const nativeFetch = window.fetch ? window.fetch.bind(window) : null;
            if (nativeFetch) {
                window.fetch = function (input, init) {
                    const request = input instanceof Request ? input : null;
                    const requestUrl = request ? request.url : input;
                    const requestMethod = (init && init.method) || (request ? request.method : 'GET');

                    if (!requiresCsrf(requestMethod) || !isSameOrigin(requestUrl) || !window.csrfToken) {
                        return nativeFetch(input, init);
                    }

                    if (request) {
                        const requestInit = Object.assign({}, init || {});
                        const headers = new Headers(request.headers || {});
                        const overrideHeaders = new Headers(requestInit.headers || {});
                        overrideHeaders.forEach(function (value, key) {
                            headers.set(key, value);
                        });
                        if (!headers.has(window.CSRF_HEADER)) {
                            headers.set(window.CSRF_HEADER, window.csrfToken);
                        }
                        requestInit.headers = headers;
                        return nativeFetch(new Request(request, requestInit));
                    }

                    const requestInit = Object.assign({}, init || {});
                    const headers = new Headers(requestInit.headers || {});
                    if (!headers.has(window.CSRF_HEADER)) {
                        headers.set(window.CSRF_HEADER, window.csrfToken);
                    }
                    requestInit.headers = headers;
                    return nativeFetch(input, requestInit);
                };
            }

            document.addEventListener('DOMContentLoaded', ensureAllFormTokens);
            document.addEventListener('submit', function (event) {
                ensureFormToken(event.target);
            }, true);
        })();
    </script>

    {% block scripts %}{% endblock %}

    
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const dropdownItems = Array.from(document.querySelectorAll('[data-dropdown-trigger]'))
                .map(function (button) {
                    return { button: button, panel: button.parentElement.querySelector(':scope > .absolute') };
                })
                .filter(function (item) {
                    return item.panel;
                });

            function hideDropdown(item) {
                if (item.panel.classList.contains('hidden')) {
                    item.button.setAttribute('aria-expanded', 'false');
                    return;
                }

                item.panel.classList.remove('dropdown-enter-active');
                item.panel.classList.add('dropdown-leave');
                item.button.setAttribute('aria-expanded', 'false');
                setTimeout(function () {
                    item.panel.classList.remove('dropdown-leave');
                    item.panel.classList.add('dropdown-leave-active', 'hidden');
                }, 10);
            }

            function showDropdown(item) {
                item.panel.classList.remove('hidden', 'dropdown-leave-active');
                item.panel.classList.add('dropdown-enter');
                item.button.setAttribute('aria-expanded', 'true');
                setTimeout(function () {
                    item.panel.classList.remove('dropdown-enter');
                    item.panel.classList.add('dropdown-enter-active');
                }, 10);
            }

            function closeAllDropdowns(exceptItem) {
                dropdownItems.forEach(function (item) {
                    if (!exceptItem || item.panel !== exceptItem.panel) {
                        hideDropdown(item);
                    }
                });
            }

            dropdownItems.forEach(function (item) {
                item.button.addEventListener('click', function (event) {
                    event.stopPropagation();
                    if (item.panel.classList.contains('hidden')) {
                        closeAllDropdowns(item);
                        showDropdown(item);
                    } else {
                        hideDropdown(item);
                    }
                });
            });

            const mobileMenuRoots = Array.from(document.querySelectorAll('[data-mobile-menu-root]'));

            function closeMobileMenu(root) {
                var button = root.querySelector('[data-mobile-menu-toggle]');
                var panel = root.querySelector('[data-mobile-menu-panel]');
                var icon = button ? button.querySelector('iconify-icon:last-child') : null;
                if (!button || !panel) {
                    return;
                }
                panel.classList.add('hidden');
                button.setAttribute('aria-expanded', 'false');
                if (icon) {
                    icon.classList.remove('rotate-180');
                }
            }

            mobileMenuRoots.forEach(function (root) {
                var button = root.querySelector('[data-mobile-menu-toggle]');
                var panel = root.querySelector('[data-mobile-menu-panel]');
                var icon = button ? button.querySelector('iconify-icon:last-child') : null;

                if (!button || !panel) {
                    return;
                }

                button.addEventListener('click', function (event) {
                    event.stopPropagation();
                    var isHidden = panel.classList.contains('hidden');
                    mobileMenuRoots.forEach(function (otherRoot) {
                        if (otherRoot !== root) {
                            closeMobileMenu(otherRoot);
                        }
                    });

                    if (isHidden) {
                        panel.classList.remove('hidden');
                        button.setAttribute('aria-expanded', 'true');
                        if (icon) {
                            icon.classList.add('rotate-180');
                        }
                    } else {
                        closeMobileMenu(root);
                    }
                });

                panel.querySelectorAll('a').forEach(function (link) {
                    link.addEventListener('click', function () {
                        closeMobileMenu(root);
                    });
                });
            });

            function closeOverlaysOnOutsideClick(event) {
                if (!event.target.closest('[data-dropdown-trigger]') && !event.target.closest('[role="menu"]')) {
                    closeAllDropdowns();
                }

                mobileMenuRoots.forEach(function (root) {
                    if (!event.target.closest('[data-mobile-menu-root]')) {
                        closeMobileMenu(root);
                    }
                });
            }

            document.addEventListener('click', closeOverlaysOnOutsideClick);

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape') {
                    closeAllDropdowns();
                    mobileMenuRoots.forEach(closeMobileMenu);
                }
            });

            window.addEventListener('resize', function () {
                closeAllDropdowns();
                mobileMenuRoots.forEach(closeMobileMenu);
            });

            const header = document.getElementById('header');
            const menu = document.getElementById('menu');
            if (header && menu) {
                window.addEventListener('scroll', function () {
                    const menuTop = menu.getBoundingClientRect().top;
                    header.classList.toggle('hidden', menuTop > 0);
                }, { passive: true });
            }
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var wraps = Array.from(document.querySelectorAll('.author-tooltip-wrap'));
            if (!wraps.length) {
                return;
            }

            var hideTimers = new WeakMap();
            var triggerByWrap = new WeakMap();
            var cardByWrap = new WeakMap();
            var cardOrigins = new WeakMap();

            wraps.forEach(function (wrap) {
                var trigger = wrap.querySelector('.author-tooltip-trigger');
                var card = wrap.querySelector('.author-tooltip-card');
                if (!trigger || !card) {
                    return;
                }
                triggerByWrap.set(wrap, trigger);
                cardByWrap.set(wrap, card);
            });

            function clearHideTimer(wrap) {
                var timer = hideTimers.get(wrap);
                if (timer) {
                    clearTimeout(timer);
                    hideTimers.delete(wrap);
                }
            }

            function getTrigger(wrap) {
                return triggerByWrap.get(wrap);
            }

            function getCard(wrap) {
                return cardByWrap.get(wrap);
            }

            function detachCardToBody(card) {
                if (!card || card.parentElement === document.body) {
                    return;
                }

                cardOrigins.set(card, {
                    parent: card.parentElement,
                    nextSibling: card.nextSibling
                });
                document.body.appendChild(card);
            }

            function restoreCardOrigin(card) {
                var origin = cardOrigins.get(card);
                if (!card || !origin) {
                    return;
                }

                var parent = origin.parent;
                var nextSibling = origin.nextSibling;
                if (!parent) {
                    cardOrigins.delete(card);
                    return;
                }

                if (nextSibling && nextSibling.parentNode === parent) {
                    parent.insertBefore(card, nextSibling);
                } else {
                    parent.appendChild(card);
                }
                cardOrigins.delete(card);
            }

            function positionCard(trigger, card) {
                if (!trigger || !card) {
                    return;
                }

                card.style.left = '-9999px';
                card.style.top = '-9999px';

                var triggerRect = trigger.getBoundingClientRect();
                var cardRect = card.getBoundingClientRect();
                var viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
                var viewportHeight = window.innerHeight || document.documentElement.clientHeight || 0;
                var gutter = 12;
                var gap = 10;

                var left = triggerRect.left + (triggerRect.width / 2) - (cardRect.width / 2);
                var maxLeft = Math.max(gutter, viewportWidth - cardRect.width - gutter);
                left = Math.max(gutter, Math.min(left, maxLeft));

                var top = triggerRect.bottom + gap;
                if (top + cardRect.height > viewportHeight - gutter) {
                    top = triggerRect.top - cardRect.height - gap;
                }
                if (top < gutter) {
                    top = gutter;
                }

                card.style.left = Math.round(left) + 'px';
                card.style.top = Math.round(top) + 'px';
            }

            function hideTooltip(wrap) {
                var trigger = getTrigger(wrap);
                var card = getCard(wrap);
                if (!card) {
                    return;
                }

                card.classList.remove('is-visible');
                card.setAttribute('aria-hidden', 'true');
                card.style.left = '-9999px';
                card.style.top = '-9999px';
                if (trigger) {
                    trigger.setAttribute('aria-expanded', 'false');
                }
                restoreCardOrigin(card);
            }

            function scheduleHide(wrap, delay) {
                clearHideTimer(wrap);
                var timer = setTimeout(function () {
                    hideTooltip(wrap);
                }, delay);
                hideTimers.set(wrap, timer);
            }

            function showTooltip(wrap) {
                var trigger = getTrigger(wrap);
                var card = getCard(wrap);
                if (!trigger || !card) {
                    return;
                }

                clearHideTimer(wrap);
                wraps.forEach(function (otherWrap) {
                    if (otherWrap !== wrap) {
                        clearHideTimer(otherWrap);
                        hideTooltip(otherWrap);
                    }
                });

                detachCardToBody(card);
                card.classList.add('is-visible');
                card.setAttribute('aria-hidden', 'false');
                trigger.setAttribute('aria-expanded', 'true');
                positionCard(trigger, card);
            }

            wraps.forEach(function (wrap) {
                var trigger = getTrigger(wrap);
                var card = getCard(wrap);
                if (!trigger || !card) {
                    return;
                }

                trigger.addEventListener('mouseenter', function () {
                    showTooltip(wrap);
                });

                trigger.addEventListener('focus', function () {
                    showTooltip(wrap);
                });

                wrap.addEventListener('mouseleave', function () {
                    scheduleHide(wrap, 100);
                });

                trigger.addEventListener('blur', function () {
                    scheduleHide(wrap, 100);
                });

                card.addEventListener('mouseenter', function () {
                    clearHideTimer(wrap);
                });

                card.addEventListener('mouseleave', function () {
                    scheduleHide(wrap, 100);
                });
            });

            document.addEventListener('click', function (event) {
                if (event.target.closest('.author-tooltip-wrap') || event.target.closest('.author-tooltip-card')) {
                    return;
                }
                wraps.forEach(function (wrap) {
                    clearHideTimer(wrap);
                    hideTooltip(wrap);
                });
            });

            window.addEventListener('resize', function () {
                wraps.forEach(function (wrap) {
                    clearHideTimer(wrap);
                    hideTooltip(wrap);
                });
            });

            window.addEventListener('scroll', function () {
                wraps.forEach(function (wrap) {
                    clearHideTimer(wrap);
                    hideTooltip(wrap);
                });
            }, true);
        });
    </script>

</body>

</html>
