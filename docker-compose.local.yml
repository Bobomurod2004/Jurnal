# ============================================
# LOCAL DEVELOPMENT docker-compose
# Usage: docker compose -f docker-compose.local.yml up --build
# Access:
#   http://localhost:8080/          -> mainweb via local nginx
#   http://localhost:8080/fmadmin/  -> fmadmin via local nginx
#   http://localhost:5000/          -> mainweb directly
#   http://localhost:5001/fmadmin/  -> fmadmin directly
# ============================================

services:
  db:
    image: postgres:17-alpine
    container_name: journal_db_local
    restart: unless-stopped
    environment:
      POSTGRES_DB: journal2
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "1"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ./db_backup.sql:/docker-entrypoint-initdb.d/01-restore.sql:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d journal2"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - journal_local

  mailpit:
    image: axllent/mailpit:latest
    container_name: journal_mailpit_local
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - journal_local

  mainweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journal_mainweb_local
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - APP_HOST=localhost:8080
      - APP_BASE_URL=http://localhost:8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=1
      - DB_NAME=journal2
      - SECRET_KEY=local-dev-secret-key
      - TRANSLATION_SYNC_TOKEN=local-translation-sync-token
      - SAVE_PATH=/var/www/journal/
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-}
      - GOOGLE_AUTH_ENABLED=${GOOGLE_AUTH_ENABLED:-}
      - GOOGLE_REQUEST_TIMEOUT=${GOOGLE_REQUEST_TIMEOUT:-10}
      - ORCID_CLIENT_ID=${ORCID_CLIENT_ID:-}
      - ORCID_CLIENT_SECRET=${ORCID_CLIENT_SECRET:-}
      - ORCID_REDIRECT_URI=${ORCID_REDIRECT_URI:-}
      - ORCID_AUTH_ENABLED=${ORCID_AUTH_ENABLED:-}
      - ORCID_BASE_URL=${ORCID_BASE_URL:-https://orcid.org}
      - ORCID_SCOPE=${ORCID_SCOPE:-/authenticate}
      - ORCID_REQUEST_TIMEOUT=${ORCID_REQUEST_TIMEOUT:-10}
      - MAIL_ENABLED=${MAIL_ENABLED:-1}
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-0}
      - MAIL_USE_SSL=${MAIL_USE_SSL:-0}
      - MAIL_SUPPRESS_SEND=${MAIL_SUPPRESS_SEND:-0}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-philolm.uz@gmail.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Philology Matters}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-philologymatters@uzswlu.uz}
      - MAIL_CONTACT_RECIPIENTS=${MAIL_CONTACT_RECIPIENTS:-philologymatters@uzswlu.uz,philolm.uz@gmail.com}
    volumes:
      - ./mainweb:/app/mainweb
      - uploads_local:/var/www/journal/static/uploads
      - private_uploads_local:/var/www/journal/private_uploads
    working_dir: /app/mainweb
    command: gunicorn --bind 0.0.0.0:5000 --workers 1 --threads 2 --timeout 180 --keep-alive 5 --reload --access-logfile - --error-logfile - run:app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "5000:5000"
    networks:
      - journal_local

  fmadmin:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journal_fmadmin_local
    restart: unless-stopped
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=1
      - APP_HOST=localhost:8080
      - APP_BASE_URL=http://localhost:8080
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=1
      - DB_NAME=journal2
      - MAINWEB_INTERNAL_URL=http://mainweb:5000
      - FMADMIN_SECRET_KEY=local-fmadmin-secret-key
      - TRANSLATION_SYNC_TOKEN=local-translation-sync-token
      - SAVE_PATH=/var/www/journal/
      - MAIL_ENABLED=${MAIL_ENABLED:-1}
      - MAIL_HOST=${MAIL_HOST:-mailpit}
      - MAIL_PORT=${MAIL_PORT:-1025}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_USE_TLS=${MAIL_USE_TLS:-0}
      - MAIL_USE_SSL=${MAIL_USE_SSL:-0}
      - MAIL_SUPPRESS_SEND=${MAIL_SUPPRESS_SEND:-0}
      - MAIL_FROM_EMAIL=${MAIL_FROM_EMAIL:-philolm.uz@gmail.com}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Philology Matters}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-philologymatters@uzswlu.uz}
      - MAIL_CONTACT_RECIPIENTS=${MAIL_CONTACT_RECIPIENTS:-philologymatters@uzswlu.uz,philolm.uz@gmail.com}
    volumes:
      - ./fmadmin:/app/fmadmin
      - uploads_local:/var/www/journal/static/uploads
      - private_uploads_local:/var/www/journal/private_uploads
    working_dir: /app/fmadmin
    command: gunicorn --bind 0.0.0.0:5001 --workers 1 --threads 2 --timeout 180 --keep-alive 5 --reload --access-logfile - --error-logfile - run:app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    ports:
      - "5001:5001"
    networks:
      - journal_local

  nginx:
    image: nginx:alpine
    container_name: journal_nginx_local
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.local.conf:/etc/nginx/nginx.conf:ro
      - ./mainweb/static:/var/www/mainweb/static:ro
      - ./fmadmin/dist:/var/www/fmadmin/dist:ro
      - ./fmadmin/static:/var/www/fmadmin/static:ro
      - uploads_local:/var/www/journal/static/uploads:ro
    depends_on:
      mainweb:
        condition: service_healthy
      fmadmin:
        condition: service_healthy
    networks:
      - journal_local

volumes:
  postgres_data_local:
  uploads_local:
  private_uploads_local:

networks:
  journal_local:
    driver: bridge
