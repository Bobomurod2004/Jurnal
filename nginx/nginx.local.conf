# ============================================
# LOCAL DEVELOPMENT nginx config
# No SSL, no rate limiting, Swagger docs enabled
# ============================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    # Upstream servers
    upstream mainweb {
        server mainweb:5000;
    }

    upstream fmadmin {
        server fmadmin:5001;
    }

    server {
        listen 80;
        server_name localhost;

        location = /favicon.ico {
            alias /var/www/mainweb/static/favicon.ico;
            expires 1d;
        }

        # Mainweb static files
        location /static/ {
            alias /var/www/mainweb/static/;
            expires 1d;
        }

        # Uploaded files (shared between apps)
        location ~ ^/static/uploads/(articles|documents|payments)/ {
            return 404;
        }

        location /static/uploads/ {
            alias /var/www/journal/static/uploads/;
            expires 1d;
        }

        # fmadmin bundled assets
        location /dist/ {
            alias /var/www/fmadmin/dist/;
            expires 1d;
        }

        # Swagger docs (available in local)
        location /api/docs {
            proxy_pass http://mainweb;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /apispec.json {
            proxy_pass http://mainweb;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Long-lived SSE connections for the submission chat feature.
        location ~ ^/api/submissions/\d+/messages/stream$ {
            proxy_pass http://mainweb;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        location ~ ^/fmadmin/(submissions|editor-assignments)/\d+/messages/stream$ {
            proxy_pass http://fmadmin;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            add_header X-Accel-Buffering no;
        }

        # Admin panel
        location /fmadmin/ {
            proxy_pass http://fmadmin/fmadmin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Main website (default)
        location / {
            proxy_pass http://mainweb/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 60s;
            proxy_read_timeout 120s;
        }

        # Error pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
