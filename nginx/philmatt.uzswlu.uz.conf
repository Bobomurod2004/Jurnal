# Host nginx for philmatt.uzswlu.uz
#
# Replaces /etc/nginx/sites-available/philmatt.uzswlu.uz. The previous version
# proxied EVERYTHING to Flask, including /static/ -- so every image tied up a
# gunicorn worker. Serving them here frees the workers for real requests.
#
# Before enabling, fill in UPLOADS_PATH below:
#     docker volume ls | grep uploads
#     docker volume inspect <name> --format '{{ .Mountpoint }}'
#
# Then:
#     sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name philmatt.uzswlu.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name philmatt.uzswlu.uz;

    ssl_certificate     /etc/nginx/certs/STAR25_uzswlu_uz.crt;
    ssl_certificate_key /etc/nginx/certs/STAR25_uzswlu_uz.key;

    server_tokens off;
    client_max_body_size 100M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    # Grafana Live speaks WebSocket.
    # (map lives in the http{} block -- see the note at the end of this file)

    # ---------------------------------------------------------------- static

    location = /favicon.ico {
        alias /root/Jurnal/mainweb/static/favicon.ico;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location = /robots.txt {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Paid and private material must never be served straight off disk -- the
    # app checks entitlement before handing these out. Regex locations are
    # evaluated before the plain /static/ prefixes below, so this wins.
    location ~ ^/static/uploads/(articles|documents|payments)/ {
        return 404;
    }

    # Uploaded images (editorial photos, covers, gallery). Docker volume:
    #     docker volume inspect <project>_uploads_data --format '{{ .Mountpoint }}'
    location /static/uploads/ {
        alias UPLOADS_PATH/;          # <-- replace, keep the trailing slash
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Application assets shipped with the repo (CSS, JS, logos).
    location /static/ {
        alias /root/Jurnal/mainweb/static/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # fmadmin's Tabler bundle.
    location /dist/ {
        alias /root/Jurnal/fmadmin/dist/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # ------------------------------------------------------- internal probes

    # Prometheus and the health checks reach the containers directly on
    # 127.0.0.1; there is no reason to expose them to the internet.
    location = /metrics { return 404; }
    location = /readyz  { return 404; }
    location = /healthz { return 404; }

    # ------------------------------------------------------------- streaming

    # Server-sent events for the submission chat. Buffering must be off or the
    # messages only arrive once nginx decides the buffer is full.
    location ~ ^/api/submissions/\d+/messages/stream$ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location ~ ^/fmadmin/(submissions|editor-assignments)/\d+/messages/stream$ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # ------------------------------------------------------------ monitoring

    # Grafana. Needs, in .env:
    #     GRAFANA_ROOT_URL=https://philmatt.uzswlu.uz/grafana/
    #     GRAFANA_SERVE_FROM_SUB_PATH=true
    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    # ----------------------------------------------------------- application

    location /fmadmin/ {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# ---------------------------------------------------------------------------
# The $connection_upgrade map used by /grafana/ has to live in the http{}
# block, not in a server{}. Put this in /etc/nginx/conf.d/websocket.conf:
#
#     map $http_upgrade $connection_upgrade {
#         default upgrade;
#         ''      close;
#     }
#
# Skip it (and the /grafana/ block) if you are not exposing Grafana.
# ---------------------------------------------------------------------------
