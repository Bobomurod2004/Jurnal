# ============================================
# PRODUCTION / SERVER docker-compose
# Usage: docker compose up -d
# ============================================

services:
  db:
    image: postgres:17-alpine
    container_name: journal_db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./translations_seed.sql:/docker-entrypoint-initdb.d/02-translations.sql:ro
      - ./migrations:/app/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - journal_net

  db-init:
    image: ${IMAGE_REGISTRY:-}journal_mainweb:${APP_VERSION:-0.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journal_db_init
    restart: "no"
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:-}
      SUPERADMIN_NAME: ${SUPERADMIN_NAME:-Super Admin}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:-}
    volumes:
      - ./db_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./translations_seed.sql:/docker-entrypoint-initdb.d/02-translations.sql:ro
      - ./migrations:/app/migrations:ro
    working_dir: /app
    command: bash /app/scripts/init-db.sh
    depends_on:
      db:
        condition: service_healthy
    networks:
      - journal_net

  mainweb:
    image: ${IMAGE_REGISTRY:-}journal_mainweb:${APP_VERSION:-0.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journal_mainweb
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_ENV: production
    volumes:
      - uploads_data:/var/www/journal/static/uploads
      - private_uploads_data:/var/www/journal/private_uploads
    working_dir: /app/mainweb
    command: gunicorn --bind 0.0.0.0:5000 --workers 4 --threads 2 --timeout 120 --access-logfile - --error-logfile - run:app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    expose:
      - "5000"
    networks:
      - journal_net

  fmadmin:
    image: ${IMAGE_REGISTRY:-}journal_fmadmin:${APP_VERSION:-0.0.0}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: journal_fmadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_ENV: production
    volumes:
      - uploads_data:/var/www/journal/static/uploads
      - private_uploads_data:/var/www/journal/private_uploads
    working_dir: /app/fmadmin
    command: gunicorn --bind 0.0.0.0:5001 --workers 4 --threads 2 --timeout 120 --access-logfile - --error-logfile - run:app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5001/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    expose:
      - "5001"
    networks:
      - journal_net

  nginx:
    image: nginx:alpine
    container_name: journal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./mainweb/static:/var/www/mainweb/static:ro
      - ./fmadmin/dist:/var/www/fmadmin/dist:ro
      - ./fmadmin/static:/var/www/fmadmin/static:ro
      - uploads_data:/var/www/journal/static/uploads:ro
      - /etc/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      mainweb:
        condition: service_healthy
      fmadmin:
        condition: service_healthy
    networks:
      - journal_net

volumes:
  postgres_data:
  uploads_data:
  private_uploads_data:

networks:
  journal_net:
    driver: bridge
